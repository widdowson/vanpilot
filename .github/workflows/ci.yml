name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest  # macOS for Android SDK + Robolectric
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          external-cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build all targets
        run: |
          REMOTE_CACHE_FLAG=""
          if [ -n "$BAZEL_REMOTE_CACHE_URL" ]; then
            REMOTE_CACHE_FLAG="--remote_cache=$BAZEL_REMOTE_CACHE_URL"
          fi
          bazel build //... --config=ci $REMOTE_CACHE_FLAG
        env:
          BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}

      - name: Run all tests
        run: |
          REMOTE_CACHE_FLAG=""
          if [ -n "$BAZEL_REMOTE_CACHE_URL" ]; then
            REMOTE_CACHE_FLAG="--remote_cache=$BAZEL_REMOTE_CACHE_URL"
          fi
          bazel test //... --test_output=errors --config=ci $REMOTE_CACHE_FLAG
        env:
          BAZEL_REMOTE_CACHE_URL: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: bazel-testlogs/**/test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload golden diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: bazel-testlogs/**/test.outputs/*diff*
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload golden test outputs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-outputs
          path: bazel-testlogs/**/test.outputs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload golden images (for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: goldens/
          if-no-files-found: warn
          retention-days: 30
