name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest  # macOS for Android emulator support
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build all targets
        run: bazel build //...

      - name: Run all tests
        run: bazel test //... --test_output=errors

      - name: Upload golden diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: bazel-testlogs/**/test.outputs/
          retention-days: 7

      - name: Upload golden images (for review)
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: goldens/
          retention-days: 30