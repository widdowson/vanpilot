# VanPilot docker-compose — single consolidated agent container.
#
# Everything runs in one container per DESIGN.md §2.1:
#   - tmux (session manager)
#   - Claude Code lead agent (spawns sub-agents via agent teams)
#   - Supervisory process (gRPC server on port 50051)
#   - MCP server (stdio, spawned by Claude Code via .mcp.json)
#
# Resource limits per DESIGN.md §9.3: Docker resource limits
# are the blast radius control for sandboxed agents.

services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1
      - NUM_TEAMMATES=${NUM_TEAMMATES:-0}
      # Configurable gRPC endpoints for Tailscale wiring (issue #65).
      # GRPC_HOST: bind address (default: [::] = all interfaces)
      # GRPC_PORT: listen port (default: 50051)
      # GRPC_APP_TARGET: Android app reverse-service address (default: localhost:50052)
      - GRPC_HOST=${GRPC_HOST:-[::]}
      - GRPC_PORT=${GRPC_PORT:-50051}
      - GRPC_APP_TARGET=${GRPC_APP_TARGET:-localhost:50052}
    volumes:
      # Mount the project repo so Claude Code agents can read/write code
      - .:/workspace
    working_dir: /workspace
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import grpc, os; port = os.environ.get('GRPC_PORT', '50051'); ch = grpc.insecure_channel(f'localhost:{port}'); grpc.channel_ready_future(ch).result(timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vanpilot

networks:
  vanpilot:
    driver: bridge
