# VanPilot docker-compose — single consolidated agent container.
#
# Everything runs in one container per DESIGN.md §2.1:
#   - tmux (session manager)
#   - Claude Code lead agent (spawns sub-agents via agent teams)
#   - Supervisory process (gRPC server on port 50051)
#   - MCP server (stdio, spawned by Claude Code via .mcp.json)
#
# Resource limits per DESIGN.md §9.3: Docker resource limits
# are the blast radius control for sandboxed agents.

services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    ports:
      - "50051:50051"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1
    volumes:
      # Mount the project repo so Claude Code agents can read/write code
      - .:/workspace
    working_dir: /workspace
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import grpc; ch = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vanpilot

networks:
  vanpilot:
    driver: bridge
