syntax = "proto3";

package vanpilot.v1;

option java_package = "com.vanpilot.proto.v1";
option java_multiple_files = true;

// Manages Android emulator + DHU instance pairs on the macOS host.
// Sandbox workers call this to spin up isolated testing environments.
service InstanceManagerService {
  // Create a new emulator + DHU instance pair.
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);

  // Destroy an existing instance, killing emulator and DHU processes.
  rpc DestroyInstance(DestroyInstanceRequest) returns (DestroyInstanceResponse);

  // List all known instances and their states.
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);

  // Get details for a single instance by name.
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);

  // Capture a DHU screenshot from a running instance.
  rpc ScreenshotInstance(ScreenshotInstanceRequest) returns (ScreenshotInstanceResponse);

  // Restart the DHU for an existing running instance (without touching the emulator).
  // Useful after installing an APK so Android Auto discovers the new app.
  rpc RestartDhu(RestartDhuRequest) returns (RestartDhuResponse);

  // Send a console command to the DHU (e.g. "tap 300 430", "keycode home", "day").
  // Optionally captures a screenshot after the command executes.
  rpc DhuCommand(DhuCommandRequest) returns (DhuCommandResponse);

  // Start capturing DHU video via screenshot polling.
  // At most one capture per instance at a time. Frames are captured at the
  // requested FPS and stitched into MP4 with ffmpeg when stopped.
  rpc StartVideoCapture(StartVideoCaptureRequest) returns (StartVideoCaptureResponse);

  // Stop an active video capture and return the stitched MP4 video.
  rpc StopVideoCapture(StopVideoCaptureRequest) returns (StopVideoCaptureResponse);

  // Install an APK on a running emulator instance via adb install.
  // Optionally restarts the DHU afterwards so Android Auto discovers the new app.
  rpc InstallApk(InstallApkRequest) returns (InstallApkResponse);

  // Run an arbitrary `adb shell` command on a running instance.
  // SECURITY: Callers must be trusted (sandbox agents only).
  rpc AdbShell(AdbShellRequest) returns (AdbShellResponse);

  // Push a file from the caller to the emulator's filesystem.
  rpc AdbPush(AdbPushRequest) returns (AdbPushResponse);

  // Pull a file from the emulator's filesystem to the caller.
  rpc AdbPull(AdbPullRequest) returns (AdbPullResponse);

  // Save the current emulator state as a named snapshot.
  // Useful after APK install so future creates can skip the install step.
  rpc SaveSnapshot(SaveSnapshotRequest) returns (SaveSnapshotResponse);

  // Load (restore) a previously saved snapshot on a running instance.
  // The emulator reverts to the saved state; DHU connection is preserved.
  rpc LoadSnapshot(LoadSnapshotRequest) returns (LoadSnapshotResponse);
}

message CreateInstanceRequest {
  // Human-readable instance name (e.g., "coder-agent-1"). Must be unique.
  string name = 1;

  // true = GUI emulator window, false = headless (default).
  bool headful = 2;

  // AVD to use. Default: "vanpilot_pixel9pro_api36".
  string avd_name = 3;

  // Snapshot to restore on boot. Default: "aa_ready".
  string snapshot_name = 4;
}

message CreateInstanceResponse {
  InstanceInfo instance = 1;
}

message DestroyInstanceRequest {
  string name = 1;
}

message DestroyInstanceResponse {}

message ListInstancesRequest {}

message ListInstancesResponse {
  repeated InstanceInfo instances = 1;
}

message GetInstanceRequest {
  string name = 1;
}

message GetInstanceResponse {
  InstanceInfo instance = 1;
}

message ScreenshotInstanceRequest {
  string name = 1;
}

message ScreenshotInstanceResponse {
  // DHU screenshot as PNG bytes.
  bytes dhu_screenshot_png = 1;

  // When the screenshot was captured (milliseconds since epoch).
  int64 captured_at_ms = 2;

  // Emulator phone screen as PNG bytes (adb screencap).
  bytes emulator_screenshot_png = 3;
}

message RestartDhuRequest {
  string name = 1;
}

message RestartDhuResponse {
  InstanceInfo instance = 1;
}

message DhuCommandRequest {
  string name = 1;

  // DHU console command, e.g. "tap 300 430", "keycode home", "day".
  string command = 2;

  // If true, capture and return a DHU screenshot after the command executes.
  // A short delay (1s) is inserted before capture to let the UI settle.
  bool capture_screenshot = 3;
}

message DhuCommandResponse {
  // Millisecond epoch timestamp when the command was sent to the pipe.
  int64 executed_at_ms = 1;

  // DHU screenshot captured after the command (only if capture_screenshot was true).
  bytes screenshot_png = 2;
}

message InstanceInfo {
  string name = 1;
  InstanceState state = 2;

  // Emulator console port (e.g., 5554).
  int32 emulator_console_port = 3;

  // ADB port (e.g., 5555). Always console_port + 1.
  int32 adb_port = 4;

  // AA forwarded port (e.g., 5277).
  int32 aa_forward_port = 5;

  bool headful = 6;

  // Instance creation time (milliseconds since epoch).
  int64 created_at_ms = 7;

  string avd_name = 8;

  // Most recent DHU screenshot (populated by background refresh loop).
  // Omitted if no screenshot has been taken yet.
  bytes last_screenshot_png = 9;

  // Most recent emulator phone screen (adb screencap).
  bytes last_emulator_screenshot_png = 10;
}

message StartVideoCaptureRequest {
  // Instance name (must be running).
  string name = 1;

  // Target frames per second (clamped to 1-5, default 2).
  int32 target_fps = 2;

  // Auto-stop after this many seconds (default 30).
  int32 max_duration_s = 3;
}

message StartVideoCaptureResponse {
  // Unique identifier for this capture session.
  string capture_id = 1;
}

message StopVideoCaptureRequest {
  // Instance name.
  string name = 1;
}

message StopVideoCaptureResponse {
  // Stitched MP4 video bytes. Empty if no frames were captured.
  bytes video_mp4 = 1;

  // Number of frames captured.
  int32 frame_count = 2;

  // Achieved frame rate.
  float actual_fps = 3;

  // Total capture duration in milliseconds.
  int32 duration_ms = 4;

  // Capture session ID.
  string capture_id = 5;
}

message InstallApkRequest {
  // Instance name (must be running).
  string name = 1;

  // APK file contents.
  bytes apk_data = 2;

  // If true, restart the DHU after install so Android Auto
  // discovers the updated app.
  bool restart_dhu = 3;

  // If non-empty, save an emulator snapshot with this name after install
  // (and after DHU restart, if requested). Future creates can use this
  // snapshot to skip the install step.
  string save_snapshot = 4;
}

message InstallApkResponse {
  InstanceInfo instance = 1;
}

message AdbShellRequest {
  // Instance name (must be RUNNING).
  string name = 1;

  // Shell command + arguments, e.g. ["pm", "list", "packages"].
  repeated string args = 2;

  // Max seconds to wait (default 30, clamped to 1-300).
  int32 timeout_s = 3;
}

message AdbShellResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}

message AdbPushRequest {
  // Instance name (must be RUNNING).
  string name = 1;

  // File contents.
  bytes data = 2;

  // Destination on emulator, e.g. "/sdcard/test.txt".
  string remote_path = 3;
}

message AdbPushResponse {}

message AdbPullRequest {
  // Instance name (must be RUNNING).
  string name = 1;

  // File to pull from emulator.
  string remote_path = 2;
}

message AdbPullResponse {
  // File contents.
  bytes data = 1;
}

message SaveSnapshotRequest {
  // Instance name (must be RUNNING).
  string name = 1;

  // Snapshot name to save (e.g., "post_install_vanpilot").
  // Must match [a-zA-Z0-9][a-zA-Z0-9._-]*.
  string snapshot_name = 2;
}

message SaveSnapshotResponse {
  InstanceInfo instance = 1;
}

message LoadSnapshotRequest {
  // Instance name (must be RUNNING).
  string name = 1;

  // Snapshot name to load (e.g., "post_install_vanpilot").
  // Must match [a-zA-Z0-9][a-zA-Z0-9._-]*.
  string snapshot_name = 2;
}

message LoadSnapshotResponse {
  InstanceInfo instance = 1;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  CREATING = 1;
  RUNNING = 2;
  ERROR = 3;
  DESTROYING = 4;
}
